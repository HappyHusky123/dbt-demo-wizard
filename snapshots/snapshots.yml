snapshots:
- name: dim_well_details
  relation: source('environmental', 'wells_state')
  description: Slowly changing dimension for well details.
  config:
    database: analytics
    schema: dbo
    strategy: timestamp
    unique_key: well_id
    updated_at: timestamp
    dbt_valid_to_current: "to_date('9999-12-31')"

- name: dim_well_details_checkcols
  relation: source('environmental', 'wells_state')
  description: Slowly changing dimension for the wells information.
  config:
    database: analytics
    schema: dbo
    strategy: check
    unique_key: well_id
    check_cols: ['color', 'state', 'timestamp', 'elevation']
    dbt_valid_to_current: "to_date('9999-12-31')"